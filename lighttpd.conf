server.name = "resume-web-server"
server.document-root = "/var/www/html"
server.use-ipv6 = "disable"
server.tag = "Resume v" + env.VERSION
server.port = env.PORT
server.modules += ( "mod_rewrite", "mod_setenv" )

index-file.names = ( "index.html" )

mimetype.assign = (
  ".webmanifest" => "application/manifest+json",
  ".json"   => "application/json",
  ".ttf"   => "application/x-font-ttf",
  ".eot"   => "application/vnd.ms-fontobject",
  ".png"  => "image/png",
  ".jpg"  => "image/jpeg",
  ".jpeg" => "image/jpeg",
  ".webp" => "image/webp",
  ".ico"  => "image/x-icon",
  ".svg"  => "image/svg+xml",
  ".html" => "text/html",
  ".css"  => "text/css",
  ".js"   => "text/javascript",
  ".txt"  => "text/plain;charset=utf-8",
  ".woff"  => "font/woff",
  ".woff2" => "font/woff2"
)

debug.log-request-handling = "disabled"
static-file.etags = "enable"

setenv.set-response-header = (
    "x-frame-options" => "SAMEORIGIN",
    "x-content-type-options" => "nosniff",
    "x-xss-protection" => "0",
)

$HTTP["host"] =~ "" {
     setenv.add-response-header += ("Cache-Control" => "public, max-age=31536000, s-maxage=31536000, immutable")
     setenv.add-response-header += ("Content-Security-Policy" => "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src-elem 'self' 'unsafe-inline' 'unsafe-eval'; worker-src 'self' 'unsafe-eval' blob:; img-src 'self' blob: data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https:")
}